[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flowblow"
version = "0.1.0"
description = "Hand-drawn flow & architecture diagrams as PNG, with LaTeX and the Caveat handwriting font."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10.0",
    "matplotlib>=3.7",
    "pydantic>=2.5",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.scripts]
flowblow = "flowblow.cli:main"

[tool.setuptools]
packages = ["flowblow"]

[tool.setuptools.package-data]
flowblow = ["assets/*.ttf"]
