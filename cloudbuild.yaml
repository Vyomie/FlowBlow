# Build the FlowBlow image and deploy it to Cloud Run.
#
#   gcloud builds submit --config cloudbuild.yaml \
#       --substitutions=_REGION=us-central1,_SERVICE=flowblow
#
substitutions:
  _REGION: us-central1
  _SERVICE: flowblow

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "gcr.io/$PROJECT_ID/${_SERVICE}:$COMMIT_SHA",
           "-t", "gcr.io/$PROJECT_ID/${_SERVICE}:latest", "."]

  - name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "gcr.io/$PROJECT_ID/${_SERVICE}"]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=gcr.io/$PROJECT_ID/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=2Gi
      - --cpu=2
      - --concurrency=8

images:
  - gcr.io/$PROJECT_ID/${_SERVICE}:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
